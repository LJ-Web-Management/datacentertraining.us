name: Edge Worker (test + deploy)

# Tests the Cloudflare Worker in edge/ (Markdown negotiation, agent-friendly
# errors, rate limits, /mcp, REST tools) on every pull request and push, and
# deploys it from main once the Cloudflare secrets exist (see edge/README.md).
on:
  pull_request:
    paths:
      - "edge/**"
      - "js/webmcp.js"
      - ".github/workflows/edge.yml"
  push:
    branches: [main]
    paths:
      - "edge/**"
      - "js/webmcp.js"
      - ".github/workflows/edge.yml"
  workflow_dispatch:

concurrency:
  group: edge-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Ajv for the cross-checks
        working-directory: scripts
        run: npm ci --no-audit --no-fund

      - name: Test the Worker
        working-directory: edge
        run: npm test

      - name: Bundle the Worker (dry run)
        working-directory: edge
        run: npx --yes wrangler@4 deploy --dry-run --outdir dist

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip when Cloudflare is not set up yet
        if: env.HAS_TOKEN != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not set, so the edge Worker was not deployed. See edge/README.md."

      - name: Deploy to Cloudflare Workers
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: edge
          wranglerVersion: "4"
